<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Inspectoría - Escuela García Hurtado de Mendoza</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border-t-8 border-yellow-400">
        <!-- Encabezado Institucional -->
        <div class="bg-blue-900 text-white px-8 py-6 text-center">
            <div class="bg-white rounded-full p-1.5 shadow-lg border-2 border-yellow-400 w-24 h-24 mx-auto mb-3 flex items-center justify-center overflow-hidden">
                <img src="/static/img/logo-ghm.png" alt="Emblema Escuela García Hurtado de Mendoza" class="w-full h-full object-contain">
            </div>
            <h1 class="text-xl font-black tracking-tight">Escuela García Hurtado de Mendoza</h1>
            <p class="text-blue-200 text-xs uppercase tracking-widest font-semibold mt-1">Inspectoría General • Osorno</p>
        </div>

        <!-- Selector de Pestañas: Iniciar Sesión / Crear Cuenta -->
        <div class="grid grid-cols-2 border-b border-slate-200 bg-slate-50">
            <button type="button" id="tabLogin" onclick="mostrarFormulario('login')"
                class="py-3.5 text-xs font-black uppercase tracking-wider border-b-4 border-blue-900 text-blue-900 transition">
                Iniciar Sesión
            </button>
            <button type="button" id="tabRegistro" onclick="mostrarFormulario('registro')"
                class="py-3.5 text-xs font-black uppercase tracking-wider border-b-4 border-transparent text-slate-400 hover:text-slate-700 transition">
                Crear Cuenta
            </button>
        </div>

        <div class="p-8">
            {% if error %}
            <div class="mb-5 bg-red-50 border-l-4 border-red-600 p-3.5 rounded-r-xl text-xs font-semibold text-red-800">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            {% if exito %}
            <div class="mb-5 bg-emerald-50 border-l-4 border-emerald-600 p-3.5 rounded-r-xl text-xs font-semibold text-emerald-800">
                ✅ {{ exito }}
            </div>
            {% endif %}

            <!-- FORMULARIO 1: INICIAR SESIÓN -->
            <form id="formLogin" method="POST" action="/login" class="space-y-4">
                <div>
                    <label for="loginEmail" class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Correo Electrónico</label>
                    <input type="email" id="loginEmail" name="email" required autofocus
                        placeholder="inspector@escuelaghm.cl"
                        class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-sm font-semibold focus:border-blue-700 outline-none transition">
                </div>

                <div>
                    <label for="loginPassword" class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Contraseña</label>
                    <input type="password" id="loginPassword" name="password" required
                        placeholder="••••••••"
                        class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-sm font-semibold focus:border-blue-700 outline-none transition">
                </div>

                <button type="submit"
                    class="w-full bg-blue-900 hover:bg-blue-800 text-white font-black py-3.5 rounded-xl transition shadow-lg uppercase text-xs tracking-wider mt-2">
                    Ingresar al Sistema
                </button>
            </form>

            <!-- FORMULARIO 2: CREAR CUENTA -->
            <form id="formRegistro" method="POST" action="/registro" class="hidden space-y-4">
                <div>
                    <label for="regEmail" class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Correo Electrónico *</label>
                    <input type="email" id="regEmail" name="email" required
                        placeholder="nuevo.usuario@escuelaghm.cl"
                        class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-sm font-semibold focus:border-emerald-600 outline-none transition">
                </div>

                <div>
                    <label for="regPassword" class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Contraseña (mín. 6 caracteres) *</label>
                    <input type="password" id="regPassword" name="password" required minlength="6"
                        placeholder="••••••••"
                        class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-sm font-semibold focus:border-emerald-600 outline-none transition">
                </div>

                <div>
                    <label for="regPasswordConfirm" class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Confirmar Contraseña *</label>
                    <input type="password" id="regPasswordConfirm" name="password_confirm" required minlength="6"
                        placeholder="••••••••"
                        class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl text-sm font-semibold focus:border-emerald-600 outline-none transition">
                </div>

                <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-xl transition shadow-lg uppercase text-xs tracking-wider mt-2">
                    Registrarme e Ingresar
                </button>
            </form>
        </div>
    </div>

    <script>
        function mostrarFormulario(modo) {
            const formLogin = document.getElementById('formLogin');
            const formRegistro = document.getElementById('formRegistro');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegistro = document.getElementById('tabRegistro');

            if (modo === 'registro') {
                formLogin.classList.add('hidden');
                formRegistro.classList.remove('hidden');
                tabRegistro.className = "py-3.5 text-xs font-black uppercase tracking-wider border-b-4 border-emerald-600 text-emerald-700 transition";
                tabLogin.className = "py-3.5 text-xs font-black uppercase tracking-wider border-b-4 border-transparent text-slate-400 hover:text-slate-700 transition";
            } else {
                formRegistro.classList.add('hidden');
                formLogin.classList.remove('hidden');
                tabLogin.className = "py-3.5 text-xs font-black uppercase tracking-wider border-b-4 border-blue-900 text-blue-900 transition";
                tabRegistro.className = "py-3.5 text-xs font-black uppercase tracking-wider border-b-4 border-transparent text-slate-400 hover:text-slate-700 transition";
            }
        }

        // Mantener la pestaña activa si el servidor devolvió un error en registro
        mostrarFormulario("{{ modo or 'login' }}");
    </script>

</body>
</html>
